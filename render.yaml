# Render Blueprint: backend only (NestJS API + Postgres + Redis).
# Secrets marked `sync: false` are prompted for in the Render dashboard on first
# deploy; never commit real values here.
databases:
  - name: caresaath-db
    plan: basic-256mb
    region: singapore
    databaseName: caresaath
    user: caresaath

services:
  - type: keyvalue
    name: caresaath-redis
    plan: starter
    region: singapore
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: caresaath-api
    runtime: node
    region: singapore
    plan: starter # paid: free tier sleeps and breaks Socket.IO / background jobs
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate --config prisma7.config.ts && npm run build
    # Migrate, then seed the test accounts (admin + every role) and demo data.
    # The seed is idempotent: accounts are upserted on every deploy, the demo
    # bookings graph is only created when missing (SEED_RESET=true rebuilds it).
    preDeployCommand: npm run prisma:migrate && npm run seed
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caresaath-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: caresaath-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: JWT_REFRESH_TTL_SECONDS
        value: 2592000
      - key: PAYOUT_ENCRYPTION_KEY
        generateValue: true
      - key: CNIC_ENCRYPTION_KEY
        generateValue: true
      - key: MEDICAL_ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: RETENTION_ENABLED
        value: true
      - key: WHATSAPP_ENABLED
        value: false
      # Test-data seeding on deploy (prisma/seed.mjs). Set SEED_ALLOW_PRODUCTION=false
      # once this is a real production environment.
      - key: SEED_ALLOW_PRODUCTION
        value: true
      - key: ADMIN_EMAIL
        value: info@caresaath.com
      - key: ADMIN_PHONE
        value: '+923000000000'
      # SMTP: login OTPs are also emailed to the account's email (seeded test
      # accounts use info+<name>@caresaath.com aliases).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: CareSaath
      # Web Push (browser notifications while the app is closed). Generate with
      # `npx web-push generate-vapid-keys`; push stays off until both are set.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:info@caresaath.com
      # Supplied by the client; set in the dashboard.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: caresaath
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
