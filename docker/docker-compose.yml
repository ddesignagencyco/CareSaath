services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caresaath
      POSTGRES_PASSWORD: caresaath
      POSTGRES_DB: caresaath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
  mailhog:
    image: mailhog/mailhog
    # 1025/8025 may be taken by another local project; use 11025/18025
    ports: ["11025:1025", "18025:8025"]
volumes:
  pgdata:
  miniodata:
