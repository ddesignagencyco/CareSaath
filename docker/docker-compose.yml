services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caresaath
      POSTGRES_PASSWORD: caresaath
      POSTGRES_DB: caresaath
    ports: ["15432:5432"] # 5432 may be taken by another local project
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["16379:6379"] # 6379 may be taken by another local project
volumes:
  pgdata:
