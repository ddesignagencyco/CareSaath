services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caresaath
      POSTGRES_PASSWORD: caresaath
      POSTGRES_DB: caresaath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  miniodata:
